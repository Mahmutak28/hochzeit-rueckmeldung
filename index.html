<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Burcu & Bashar – Rückmeldung</title>
  <style>
    :root { --ink:#161616; --muted:#686868; --paper:#fff; --line:#d7d7d7; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; color:var(--ink); background:#f1f1f1; font-family:Georgia, 'Times New Roman', serif; }
    main { width:min(100%, 620px); background:var(--paper); border:1px solid #bbb; padding:clamp(28px, 7vw, 58px); box-shadow:0 8px 28px #00000012; position:relative; }
    main::before { content:''; position:absolute; inset:10px; border:1px solid #dedede; pointer-events:none; }
    .content { position:relative; }
    .monogram { font-size:clamp(43px, 10vw, 64px); letter-spacing:4px; text-align:center; font-weight:400; margin:0 0 12px; }
    h1 { text-align:center; font-size:clamp(25px, 5vw, 34px); font-weight:400; margin:0; }
    .date { text-align:center; letter-spacing:2px; font-size:14px; margin:13px 0 34px; }
    .intro { font-family:Arial, sans-serif; color:#3a3a3a; text-align:center; font-size:15px; line-height:1.6; margin:0 auto 30px; max-width:440px; }
    label, legend { display:block; font-family:Arial, sans-serif; font-size:14px; font-weight:700; margin:0 0 9px; }
    .field { margin:0 0 23px; }
    input[type=text], select { width:100%; border:1px solid #777; border-radius:0; background:#fff; padding:13px; min-height:47px; font:16px Arial, sans-serif; color:var(--ink); }
    fieldset { margin:0; padding:0; border:0; }
    .choice { display:flex; align-items:center; gap:10px; font-family:Arial, sans-serif; font-size:15px; font-weight:400; margin:11px 0; cursor:pointer; }
    .choice input { width:18px; height:18px; accent-color:#111; }
    button { width:100%; border:1px solid #111; background:#111; color:#fff; padding:14px; min-height:50px; font:700 14px Arial, sans-serif; letter-spacing:.5px; cursor:pointer; }
    button:hover, button:focus { background:#fff; color:#111; }
    .hint, #status { font:13px/1.5 Arial, sans-serif; color:var(--muted); text-align:center; margin:18px 0 0; }
    #status[hidden], #peopleField[hidden] { display:none; }
    .success { color:#17612d !important; }
    .error { color:#9b1c1c !important; }
    .honeypot { position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden; }
    footer { margin-top:34px; text-align:center; font:12px Arial, sans-serif; color:#666; }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <p class="monogram">B | B</p>
      <h1>Rückmeldung zur Hochzeitsfeier</h1>
      <p class="date">26 | 09 | 2026</p>
      <p class="intro">Wir freuen uns, unseren besonderen Tag mit euch zu feiern.<br>Bitte gebt uns bis spätestens <strong>15.09.2026</strong> Bescheid.</p>

      <!-- Ersetze PASTE_YOUR_APPS_SCRIPT_URL_HERE durch die Web-App-URL aus der Anleitung. -->
      <form id="rsvpForm" action="https://script.google.com/macros/s/AKfycby6btSN5R9B01pgYSXHLnbjSDHj3L6CvC_o2OKlm8eolEEEv9xh3Yr4Z1NhXbwwOG9jXw/exec" method="post" target="submitFrame">
        <div class="field">
          <label for="familyName">Familienname</label>
          <input id="familyName" name="familyName" type="text" autocomplete="family-name" required maxlength="80" placeholder="z. B. Hier euren Familiennamen eintragen">
        </div>

        <div class="field">
          <fieldset>
            <legend>Könnt ihr an unserer Hochzeitsfeier teilnehmen?</legend>
            <label class="choice"><input type="radio" name="attendance" value="Ja" required> Ja, wir kommen gerne</label>
            <label class="choice"><input type="radio" name="attendance" value="Nein"> Leider können wir nicht kommen</label>
          </fieldset>
        </div>

        <div class="field" id="peopleField" hidden>
          <label for="peopleCount">Mit wie vielen Personen kommt ihr?</label>
          <select id="peopleCount" name="peopleCount" disabled>
            <option value="" selected>Bitte auswählen</option>
            <option value="1">1 Person</option>
            <option value="2">2 Personen</option>
            <option value="3">3 Personen</option>
            <option value="4">4 Personen</option>
            <option value="5">5 Personen</option>
            <option value="6">6 oder mehr Personen</option>
          </select>
        </div>

        <div class="honeypot" aria-hidden="true">
          <label for="website">Website</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit">Rückmeldung absenden</button>
      </form>
      <p id="status" hidden aria-live="polite"></p>
      <p class="hint">Mehrzweckhalle Hawangen · 17:00 Uhr</p>
      <footer>Burcu & Bashar</footer>
    </div>
  </main>
  <iframe name="submitFrame" title="Übermittlung" hidden></iframe>

  <script>
    const form = document.getElementById('rsvpForm');
    const peopleField = document.getElementById('peopleField');
    const peopleCount = document.getElementById('peopleCount');
    const status = document.getElementById('status');

    function updatePeopleField() {
      const selection = document.querySelector('input[name="attendance"]:checked');
      const coming = selection && selection.value === 'Ja';
      peopleField.hidden = !coming;
      peopleCount.disabled = !coming;
      peopleCount.required = Boolean(coming);
      if (!coming) peopleCount.value = '';
    }

    document.querySelectorAll('input[name="attendance"]').forEach(input => {
      input.addEventListener('change', updatePeopleField);
    });

    form.addEventListener('submit', event => {
      if (form.action.includes('PASTE_YOUR_APPS_SCRIPT_URL_HERE')) {
        event.preventDefault();
        status.hidden = false;
        status.className = 'error';
        status.textContent = 'Die Seite ist noch nicht mit der Antwortliste verbunden.';
        return;
      }
      if (!form.checkValidity()) return;
      const attendance = document.querySelector('input[name="attendance"]:checked').value;
      status.hidden = false;
      status.className = 'success';
      status.textContent = attendance === 'Ja'
        ? 'Vielen Dank – wir freuen uns sehr, mit euch zu feiern!'
        : 'Schade, dass ihr nicht dabei sein könnt. Vielen Dank für eure Rückmeldung.';
      form.querySelector('button').disabled = true;
      form.querySelector('button').textContent = 'Rückmeldung gesendet';
    });
  </script>
</body>
</html>
